# Install as /etc/nginx/sites-available/fb-admin.amirhossein-danesh.ir
# Before enabling HTTPS use certbot --nginx -d fb-admin.amirhossein-danesh.ir
server {
    listen 80;
    listen [::]:80;
    server_name fb-admin.amirhossein-danesh.ir;

    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 512k;
    }
}
