# Both hosts use ONE application container and the same persistent database.
# Install the server blocks in the existing Nginx instance. Certbot provisions TLS.
# Add A records for both subdomains first; request:
#   certbot --nginx -d fb-admin.amirhossein-danesh.ir -d fiery-board.amirhossein-danesh.ir
server {
    listen 80;
    listen [::]:80;
    server_name fb-admin.amirhossein-danesh.ir;
    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name fiery-board.amirhossein-danesh.ir;
    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
