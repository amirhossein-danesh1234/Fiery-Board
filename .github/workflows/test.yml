name: Fiery Board CI
on:
  push:
    branches: [main, feat/voting-results-two-domains]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check server.mjs && node --check voter-service.mjs && node --check game-engine.mjs && node --check public/vote.js && node --check public/results.js && node --check public/app.js
      - run: node --test
