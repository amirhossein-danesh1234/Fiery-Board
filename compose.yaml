services:
  fiery-board:
    build: .
    image: fiery-board:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3108"
      DB_PATH: /data/fiery-board.sqlite
      ADMIN_ORIGIN: https://fb-admin.amirhossein-danesh.ir
      VOTER_ORIGIN: https://fiery-board.amirhossein-danesh.ir
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:3108:3108"
    volumes:
      - fiery_board_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
volumes:
  fiery_board_data:
